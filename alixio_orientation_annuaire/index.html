<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orientation des appels ALIXIO</title>
<style>
  :root{
    --bg:#f5f4f0; --card:#ffffff; --card2:#ece9e2; --line:#e3dfd6;
    --txt:#000000; --muted:#4a4a4a; --accent:#7fd6c8;
    --ok:#1e7a33; --pending:#8a5d00;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{display:flex;flex-direction:column;margin:0;overflow-x:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:8px}
  .layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(250px,.6fr) 1.4fr;gap:10px;align-items:stretch}
  @media(max-width:820px){html,body{height:auto}.layout{flex:none;grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:0;overflow:auto}
  .card h2{font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}

  /* ---- Questions ---- */
  .step{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .step:first-of-type{border-top:none;padding-top:2px}
  .step.enter{animation:in .25s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
  .step .body{flex:1;min-width:0}
  .step label.q{display:block;font-weight:600;font-size:13px;line-height:1.25;margin-bottom:5px}
  select{width:100%;background:var(--card);color:var(--txt);border:1.5px solid #bdb8ab;border-radius:8px;padding:6px 8px;font-size:12.5px;cursor:pointer}
  select:focus,.tick input:focus-visible+span{outline:2px solid #000;outline-offset:2px}
  .ticks{display:flex;gap:10px;flex-wrap:wrap}
  .tick{display:flex;align-items:center;gap:8px;border:1.5px solid #bdb8ab;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12.5px;font-weight:600;user-select:none}
  .tick input{position:absolute;opacity:0;pointer-events:none}
  .tick .box{width:17px;height:17px;border:2px solid #000;border-radius:4px;display:grid;place-items:center;flex:none;background:#fff}
  .tick input:checked+.box{background:var(--accent)}
  .tick input:checked+.box::after{content:"";width:4px;height:9px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .tick:has(input:checked){border-color:#000;background:#e9f8f5}
  .btn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;min-width:72px}
  .btn:hover{filter:brightness(.95)}
  .btn.ghost{background:#fff;border:1.5px solid #000;padding:3px 9px;font-size:11px}
  .btn:disabled{background:var(--card2);color:#8a8578;cursor:not-allowed;filter:none}

  /* ---- Annuaire ---- */
  .head{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;padding:0 4px 6px}
  h1{font-size:18px;margin:0}
  h1 .name{background:linear-gradient(transparent 62%,var(--accent) 62%)}
  .sub{color:var(--muted);margin:0;font-size:12px}
  .count{font-size:12px;font-weight:600;color:var(--muted)}
  #consigne .note{margin:8px 0 0}
  th{position:sticky;top:0;background:var(--card);z-index:1}
  .empty-row td{color:var(--muted);font-style:italic}
  .note{background:#e9f8f5;border-left:4px solid var(--accent);border-radius:6px;padding:6px 10px;font-size:12.5px;line-height:1.35;margin:0 0 6px}
  .placeholder{color:var(--muted);font-style:italic;font-size:13px;margin:0}
  .table-wrap{overflow:visible}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:2px solid var(--line)}
  td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  td .svc{display:block;font-size:11px;color:var(--muted);line-height:1.2}
  td.tel{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;font-size:12px}
  .status{font-size:11.5px;padding:2px 8px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
  td:nth-child(4){white-space:normal;min-width:110px}
  .status.dispo{background:rgba(46,160,67,.15);color:var(--ok)}
  .status.hors{background:#e8e6e0;color:#555}
  .status.absent{background:rgba(210,153,34,.18);color:var(--pending)}

  .toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:10}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="head">
  <h1>Orientation des appels <span class="name">ALIXIO</span></h1>
  <p class="sub">Centre de Contact – ALIXIO GROUP</p>
</div>
<div class="layout">
  <section class="card" aria-labelledby="t-questions">
    <h2 id="t-questions">Questions à poser à l'appelant <button class="btn ghost" id="reset" type="button">Réinitialiser</button></h2>
    <div id="steps"></div>
    <div id="consigne" aria-live="polite"></div>
  </section>

  <section class="card" aria-labelledby="t-result" aria-live="polite">
    <h2 id="t-result">Annuaire <span class="count" id="count"></span></h2>
    <div id="result"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =====================================================================
   DONNEES — services, personnes (fictives) et arbre de questions
   ===================================================================== */
const SERVICES = {
  LIM:  {sigle:"",    nom:"Centre d'appels de Limas"},
  MOB:  {sigle:"",    nom:"Hotline Alixio Mobilité"},
  FT:   {sigle:"",    nom:"Hotline France Travail"},
  STD:  {sigle:"",    nom:"Standard du Groupe"},
  PSY:  {sigle:"",    nom:"Assistance psychologique (Global Care)"},
  SUP:  {sigle:"",    nom:"Supervision & Qualité"},
  SI:   {sigle:"DSI", nom:"Direction des Systèmes d'Information"}
};
/* status : dispo | hors | absent (until = date de retour) — numéros de la plage fictive 01 99 00 xx xx */
const PEOPLE = [
  {n:"Camille Durand", s:"LIM", t:"01 99 00 12 01", st:"dispo"},
  {n:"Karim Benali", s:"LIM", t:"01 99 00 12 02", st:"dispo"},
  {n:"Sophie Lambert", s:"LIM", t:"01 99 00 12 03", st:"absent", until:"6 nov."},
  {n:"Mathilde Chevalier", s:"LIM", t:"01 99 00 12 04", st:"hors"},
  {n:"Nicolas Perrot", s:"LIM", t:"01 99 00 12 05", st:"dispo"},
  {n:"Julien Moreau", s:"MOB", t:"01 99 00 22 01", st:"dispo"},
  {n:"Nadia Haddad", s:"MOB", t:"01 99 00 22 02", st:"hors"},
  {n:"Thomas Girard", s:"MOB", t:"01 99 00 22 03", st:"absent", until:"4 nov."},
  {n:"Laure Bertrand", s:"MOB", t:"01 99 00 22 04", st:"dispo"},
  {n:"Mehdi Kaci", s:"MOB", t:"01 99 00 22 05", st:"dispo"},
  {n:"Claire Fontaine", s:"FT", t:"01 99 00 32 01", st:"dispo"},
  {n:"Mamadou Diallo", s:"FT", t:"01 99 00 32 02", st:"dispo"},
  {n:"Isabelle Roux", s:"FT", t:"01 99 00 32 03", st:"absent", until:"3 nov."},
  {n:"Valérie Dupuis", s:"FT", t:"01 99 00 32 04", st:"hors"},
  {n:"Omar Sylla", s:"FT", t:"01 99 00 32 05", st:"dispo"},
  {n:"Pierre Lefèvre", s:"STD", t:"01 99 00 42 01", st:"dispo"},
  {n:"Léa Martin", s:"STD", t:"01 99 00 42 02", st:"dispo"},
  {n:"Gaëlle Monnier", s:"STD", t:"01 99 00 42 03", st:"hors"},
  {n:"Lucas Berger", s:"STD", t:"01 99 00 42 04", st:"dispo"},
  {n:"Aurélie Colas", s:"STD", t:"01 99 00 42 05", st:"absent", until:"9 nov."},
  {n:"Dr Élodie Vasseur", s:"PSY", t:"01 99 00 52 01", st:"dispo"},
  {n:"Sandrine Petit", s:"PSY", t:"01 99 00 52 02", st:"dispo"},
  {n:"Vincent Aubert", s:"PSY", t:"01 99 00 52 03", st:"dispo"},
  {n:"Leïla Chaoui", s:"PSY", t:"01 99 00 52 04", st:"dispo"},
  {n:"Damien Fournier", s:"PSY", t:"01 99 00 52 05", st:"hors"},
  {n:"Yann Le Gall", s:"SUP", t:"01 99 00 62 01", st:"dispo"},
  {n:"Fatou Camara", s:"SUP", t:"01 99 00 62 02", st:"dispo"},
  {n:"Bastien Roy", s:"SUP", t:"01 99 00 62 03", st:"hors"},
  {n:"Mélanie Guillot", s:"SUP", t:"01 99 00 62 04", st:"absent", until:"2 nov."},
  {n:"Idriss Traoré", s:"SUP", t:"01 99 00 62 05", st:"dispo"},
  {n:"Stéphane Dubois", s:"SI", t:"01 99 00 82 01", st:"dispo"},
  {n:"Anaïs Perrin", s:"SI", t:"01 99 00 82 02", st:"absent", until:"5 nov."},
  {n:"Rachid Meziane", s:"SI", t:"01 99 00 82 03", st:"dispo"},
  {n:"Kévin Alves", s:"SI", t:"01 99 00 82 04", st:"hors"},
  {n:"Agnès Moulin", s:"SI", t:"01 99 00 82 05", st:"dispo"}
];

/* Arbre : un noeud = {q, type:"select"|"yesno", options:[{label, next | result}]}
   Une feuille (result) = {services:[ids], note} */
const R = (services, note) => ({result:{services, note}});
const oui = r => Object.assign({label:"Oui"}, r), non = r => Object.assign({label:"Non"}, r);
const opts = (labels, next) => labels.map(label => ({label, next}));

const Q3_lim = {q:"Un rendez-vous est-il déjà planifié ?", type:"yesno", options:[
  oui(R(["LIM"], "Modification, annulation ou confirmation : demander le nom et la date du rendez-vous puis transférer au Centre d'appels de Limas.")),
  non(R(["LIM"], "Nouvelle prise de rendez-vous : le Centre d'appels de Limas proposera un créneau et précisera le déroulé du test."))]};
const Q3_mob = {q:"L'appelant est-il déjà accompagné par Alixio Mobilité ?", type:"yesno", options:[
  oui(R(["MOB"], "Demander le nom du candidat et de son conseiller puis transférer à la hotline Alixio Mobilité.")),
  non(R(["MOB"], "Première prise de contact : la hotline expliquera la prestation et vérifiera l'éligibilité du candidat."))]};
const Q3_ft = {q:"L'appelant attend-il un rappel d'Alixio ?", type:"yesno", options:[
  oui(R(["FT"], "Rappel en attente : relever le nom, le numéro et le créneau convenu puis transférer à la hotline France Travail.")),
  non(R(["FT"], "Demande de rendez-vous : la hotline France Travail prendra le rendez-vous du demandeur d'emploi."))]};
const Q3_psy = {q:"La personne exprime-t-elle une détresse ou un danger immédiat ?", type:"yesno", options:[
  oui(R(["PSY"], "Urgence : transférer immédiatement à la cellule d'écoute, rester en ligne. Si risque vital, inviter l'appelant à contacter les secours (112) ou le 3114.")),
  non(R(["PSY"], "Demande de soutien : orienter vers la cellule d'écoute psychologique 24/7 (chat Global Care ou ligne d'écoute)."))]};
const Q3_std = {q:"L'appelant connaît-il le nom de son interlocuteur ?", type:"yesno", options:[
  oui(R(["STD"], "Le standard transfère directement à la personne ; en cas d'indisponibilité, proposer un message ou un rappel.")),
  non(R(["STD"], "Le standard identifie le bon service avec l'appelant puis oriente l'appel."))]};
const Q3_sup = {q:"Le sujet concerne-t-il un incident en cours sur la plateforme ?", type:"yesno", options:[
  oui(R(["SI"], "Incident : transférer à la DSI. Pour un incident critique (P1), joindre le support 24/7 sans attendre.")),
  non(R(["SUP"], "Demande de pilotage ou de qualité : transférer à Supervision & Qualité."))]};

const TREE = {q:"Quel est le sujet principal de l'appel ?", type:"select", options:[
  {label:"Test psychotechnique et prise de rendez-vous", next:{q:"L'appelant est-il un particulier ou une entreprise ?", type:"select",
    options:opts(["Particulier (B2C)","Entreprise (B2B)"], Q3_lim)}},
  {label:"Mobilité professionnelle et accompagnement", next:{q:"Quel est l'objet de l'appel ?", type:"select",
    options:opts(["Suivi de prestation","Question d'un candidat","Information sur l'offre de mobilité"], Q3_mob)}},
  {label:"France Travail (demandeur d'emploi)", next:{q:"Quel est l'objet de l'appel ?", type:"select",
    options:opts(["Prendre ou modifier un rendez-vous","Suivre un rappel","Question sur le dispositif"], Q3_ft)}},
  {label:"Écoute et soutien psychologique", next:{q:"Qui est l'appelant ?", type:"select",
    options:opts(["Salarié ou bénéficiaire","Proche ou collègue","Manager ou RH"], Q3_psy)}},
  {label:"Joindre une entité ou une personne du Groupe", next:{q:"Quelle entité l'appelant souhaite-t-il joindre ?", type:"select",
    options:opts(["Siège du Groupe","Filiale ou site régional","Je ne sais pas"], Q3_std)}},
  {label:"Appel interne (supervision, qualité, support)", next:{q:"Quel est le besoin ?", type:"select",
    options:opts(["Statut ou paramétrage d'une file","Écoute ou réécoute d'appels","Accès, outils ou panne"], Q3_sup)}}
]};

/* =====================================================================
   LOGIQUE
   ===================================================================== */
let answers = [];            // index de l'option choisie à chaque niveau
let shownCount = 1;          // pour animer seulement la question qui vient d'apparaître

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function walk(){
  const path = []; let node = TREE;
  for(let i = 0; node && i <= answers.length; i++){
    path.push({node, chosen: answers[i]});
    const opt = node.options[answers[i]];
    if(!opt){ node = null; break; }
    if(opt.result){ return {path, result: opt.result, label: opt.label}; }
    node = opt.next;
  }
  return {path, result: null};
}

function render(){
  const {path, result} = walk();
  const steps = $("steps");
  steps.innerHTML = "";
  path.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "step" + (i === path.length - 1 && path.length > shownCount ? " enter" : "");
    let ctrl;
    if(p.node.type === "select"){
      ctrl = `<select id="q${i}" data-level="${i}"><option value="">Choisir une réponse…</option>` +
        p.node.options.map((o, k) => `<option value="${k}"${p.chosen === k ? " selected" : ""}>${esc(o.label)}</option>`).join("") + `</select>`;
    } else {
      ctrl = `<div class="ticks">` + p.node.options.map((o, k) =>
        `<label class="tick"><input type="checkbox" data-level="${i}" data-k="${k}"${p.chosen === k ? " checked" : ""}><span class="box"></span>${esc(o.label)}</label>`).join("") + `</div>`;
    }
    div.innerHTML = `<span class="num">${i + 1}</span><div class="body"><label class="q" for="q${i}">${esc(p.node.q)}</label>${ctrl}</div>`;
    steps.appendChild(div);
  });
  shownCount = path.length;

  renderDirectory(path, result);
}

function leafServices(opt){
  if(opt.result) return opt.result.services;
  const out = [];
  opt.next.options.forEach(o => leafServices(o).forEach(s => { if(!out.includes(s)) out.push(s); }));
  return out;
}

/* Par défaut : tout l'annuaire. Chaque réponse restreint aux services encore possibles. */
function renderDirectory(path, result){
  const answered = path.filter(p => p.chosen !== undefined);
  let allowed = null;                       // null = tout l'annuaire
  if(answered.length){
    const last = answered[answered.length - 1];
    allowed = leafServices(last.node.options[last.chosen]);
  }
  const rank = Object.keys(SERVICES);
  const order = {dispo:0, hors:1, absent:2};
  const rows = PEOPLE.filter(p => !allowed || allowed.includes(p.s))
    .sort((a, b) => rank.indexOf(a.s) - rank.indexOf(b.s) || order[a.st] - order[b.st]);

  $("count").textContent = `${rows.length} contact${rows.length > 1 ? "s" : ""}`;
  $("consigne").innerHTML = result ? `<p class="note"><strong>Consigne :</strong> ${esc(result.note)}</p>` : "";

  const box = $("result");
  const body = rows.length ? rows.map(p => {
    const s = SERVICES[p.s];
    const label = p.st === "dispo" ? "Disponible" : p.st === "hors" ? "Hors ligne" : `Absent jusqu'au ${esc(p.until)}`;
    return `<tr><td><strong>${esc(p.n)}</strong></td>` +
      `<td title="${esc(s.nom)}">${s.sigle ? esc(s.sigle) : esc(s.nom)}</td>` +
      `<td class="tel">${esc(p.t)}</td><td><span class="status ${p.st}">${label}</span></td>` +
      `<td><button class="btn" type="button" data-name="${esc(p.n)}" data-tel="${esc(p.t)}">Copier</button></td></tr>`;
  }).join("") : `<tr class="empty-row"><td colspan="5">Aucun interlocuteur pour cette réponse.</td></tr>`;
  box.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Personne</th><th>Service</th><th>Téléphone</th><th>Statut</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`;
}

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove("show"), 3500);
}

$("steps").addEventListener("change", e => {
  const el = e.target, level = +el.dataset.level;
  if(el.tagName === "SELECT"){
    answers = answers.slice(0, level);
    if(el.value !== "") answers[level] = +el.value;
  } else {
    answers = answers.slice(0, level);
    if(el.checked) answers[level] = +el.dataset.k;
  }
  render();
});
/* Copie du numéro : API clipboard, avec repli execCommand (iframes sans autorisation clipboard-write) */
function copyText(text){
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch(_) {}
    ta.remove(); return ok;
  };
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(() => true, () => fallback());
  }
  return Promise.resolve(fallback());
}
$("result").addEventListener("click", e => {
  const b = e.target.closest("button[data-tel]");
  if(!b) return;
  copyText(b.dataset.tel).then(ok => {
    if(!ok){ toast(`Copie impossible : ${b.dataset.tel}`); return; }
    const prev = b.textContent; b.textContent = "Copié ✓";
    clearTimeout(b._tm); b._tm = setTimeout(() => { b.textContent = prev; }, 1500);
    toast(`Numéro copié : ${b.dataset.tel} (${b.dataset.name})`);
  });
});
$("reset").addEventListener("click", () => { answers = []; shownCount = 1; render(); });

render();
</script>
</body>
</html>
