<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démos Presales</title>
<style>
  :root{
    --bg:#f6f7fc;        /* fond de la page */
    --card:#363d90;      /* blocs */
    --num:#ffffff;       /* blocs de numéros */
    --line:#e4e6fc;      /* bordure des blocs */
    --txt:#363d90;       /* texte */
    --muted:#5b6070;     /* texte secondaire */
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{padding:32px 24px 8px;max-width:900px;margin:0 auto}
  header .logo{display:block;height:40px;width:auto;margin:0 0 16px}
  header h1{margin:0 0 6px;font-size:26px}
  header p{margin:0;color:var(--muted);font-size:14px}
  main{max-width:900px;margin:0 auto;padding:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;color:var(--txt);transition:transform .1s,border-color .1s}
  .card:hover{transform:translateY(-2px);border-color:var(--num)}
  .num{width:36px;height:36px;border-radius:8px;background:var(--num);color:#ffffff;font-weight:700;display:grid;place-items:center;flex:none}
  .label{font-size:15px;font-weight:600;flex:1}
  .arrow{color:var(--muted)}
  .card:hover .arrow{color:var(--num)}
  footer{max-width:900px;margin:0 auto;padding:24px;color:var(--muted);font-size:12px}
  .empty{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <img class="logo" src="https://www.diabolocom.com/wp-content/uploads/diabolocom-logo-1.svg" alt="Diabolocom">
  <h1>Démos Presales</h1>
  <p>Espaces client de démonstration.</p>
</header>
<main>
  <div class="grid">
      <a class="card" href="./transcript_WA/">
        <span class="num">1</span>
        <span class="label">transcript_WA</span>
        <span class="arrow">&rarr;</span>
      </a>
      <a class="card" href="./transcript_chat/">
        <span class="num">2</span>
        <span class="label">transcript_chat</span>
        <span class="arrow">&rarr;</span>
      </a>
      <a class="card" href="./hubspot/">
        <span class="num">3</span>
        <span class="label">hubspot</span>
        <span class="arrow">&rarr;</span>
      </a>
          <a class="card" href="./groupama_chat/">
        <span class="num">4</span>
        <span class="label">groupama_chat</span>
        <span class="arrow">&rarr;</span>
      </a>
  </div>
</main>
<footer>Pensez à mettre à jour le fichier index.html de la racine pour afficher lesn ouvelles pages</footer>
</body>
</html>
